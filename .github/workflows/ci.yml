name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies (no heavy predictor extras)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn statsmodels pyyaml \
                      tqdm click python-dotenv pyfaidx pysam matplotlib \
                      seaborn pytest pytest-cov ruff

      - name: Lint
        run: ruff check src tests

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: pytest -v --tb=short --cov=src --cov-report=term

  hash-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen-input hashes against manifest
        env:
          PYTHONPATH: .
        run: python -m src.harvest.hash_manifest --check
