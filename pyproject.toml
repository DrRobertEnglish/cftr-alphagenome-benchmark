[project]
name = "cftr-alphagenome-benchmark"
version = "0.1.0"
description = "Pre-registered benchmark of AlphaGenome, SpliceAI, and Pangolin on published CFTR splice variants."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Robert English", email = "correspondence-via-osf@example.invalid" },
]
keywords = [
    "CFTR", "cystic fibrosis", "splicing", "splice prediction",
    "AlphaGenome", "SpliceAI", "Pangolin", "benchmark", "preregistration",
]

dependencies = [
    # Core scientific stack
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",

    # AlphaGenome official SDK
    "alphagenome",

    # Splice predictors
    # SpliceAI: install from https://github.com/Illumina/SpliceAI (pip: spliceai==1.3.1)
    # Pangolin: install from https://github.com/tkzeng/Pangolin (pip: pangolin==1.1.1)
    # Both bring in tensorflow / pytorch and are declared as extras below to keep the
    # core install slim for people who only want to re-run the analysis on the
    # released per-variant scores.

    # Statistics
    "statsmodels>=0.14",

    # Utilities
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "click>=8.1",
    "python-dotenv>=1.0",

    # Genomic utilities
    "pyfaidx>=0.8",
    "pysam>=0.22",

    # Plotting
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
predict = [
    # Heavier install: needed only to (re)run the predictor batches
    "spliceai==1.3.1",
    "pangolin @ git+https://github.com/tkzeng/Pangolin.git",
    "tensorflow>=2.15",
    "torch>=2.2",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/DrRobertEnglish/cftr-alphagenome-benchmark"
"OSF Pre-registration" = "https://doi.org/10.17605/OSF.IO/6PGX8"
"OSF Project" = "https://osf.io/5hvgf/"
Repository = "https://github.com/DrRobertEnglish/cftr-alphagenome-benchmark"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
